<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title data-key="pageTitle"></title>
    <meta
      name="description"
      content="연세대학교 로봇 동아리 Roboin 공식 홈페이지"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="assets/css/styles.css"
    />
  </head>
  <body class="font-sans text-slate-900 bg-slate-50">
    <a
      href="#main"
      class="skip-link"
      data-key="skipLink"
      ></a
    >
    <header class="sticky top-0 z-50 bg-slate-50/90 backdrop-blur border-b border-slate-200">
      <div class="max-w-6xl mx-auto flex items-center justify-between px-4 py-4">
        <a
          href="#main"
          class="flex items-center gap-2 text-xl font-semibold tracking-tight text-slate-900"
        >
          <img
            src="assets/images/logo.jpg"
            alt="Roboin"
            class="h-10 w-10 rounded-full object-cover"
          />
          <span data-key="brandTitle"></span>
        </a>
        <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
          <a
            href="#main"
            class="nav-link"
            data-key="navHome"
            ></a
          >
          <a
            href="#about"
            class="nav-link"
            data-key="navAbout"
            ></a
          >
          <a
            href="#activities"
            class="nav-link"
            data-key="navActivities"
            ></a
          >
          <a
            href="#recruitment"
            class="nav-link"
            data-key="navRecruitment"
            ></a
          >
          <a
            href="#contact"
            class="nav-link"
            data-key="navContact"
            ></a
          >
          <a
            href="archive.html"
            class="nav-link"
            data-key="navArchive"
          ></a>
          <a
            href="resources.html"
            class="nav-link"
            data-key="navResources"
          ></a>
        </nav>
        <div class="flex items-center gap-3">
          <button
            id="lang-toggle"
            class="btn btn-secondary text-sm font-semibold"
            type="button"
            data-key="langToggleLabel"
          ></button>
          <button
            id="mobile-menu-toggle"
            class="md:hidden inline-flex items-center justify-center rounded-full border border-slate-300 p-2 text-slate-700"
            type="button"
            aria-label="Menu"
            aria-expanded="false"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.8"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
        </div>
      </div>
      <nav
        id="primary-nav"
        class="md:hidden hidden border-t border-slate-200 bg-white"
      >
        <a
          href="#main"
          class="mobile-nav-link"
          data-key="navHome"
          ></a
        >
        <a
          href="#about"
          class="mobile-nav-link"
          data-key="navAbout"
          ></a
        >
        <a
          href="#activities"
          class="mobile-nav-link"
          data-key="navActivities"
          ></a
        >
        <a
          href="#recruitment"
          class="mobile-nav-link"
          data-key="navRecruitment"
          ></a
        >
        <a
          href="#contact"
          class="mobile-nav-link"
          data-key="navContact"
          ></a
        >
          <a
            href="archive.html"
            class="mobile-nav-link"
            data-key="navArchive"
            ></a
          >
          <a
            href="resources.html"
            class="mobile-nav-link"
            data-key="navResources"
            ></a
          >
        </nav>
    </header>

    <main id="main" class="relative">
      <section
        id="main"
        class="main-gradient"
      >
        <div class="max-w-6xl mx-auto px-4 py-12 lg:py-16">
          <div class="grid gap-12 lg:grid-cols-[1.2fr,0.8fr]">
            <div class="space-y-8 text-center lg:text-left">
            <p class="inline-flex items-center rounded-full border border-blue-200 bg-white/60 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-blue-700">
              <span data-key="mainBadge"></span>
            </p>
            <div class="space-y-4">
              <img
                src="assets/images/logo_with_text.png"
                alt="연세대학교 최초이자 유일의 로봇 학술 동아리"
                class="w-full max-w-2xl h-auto"
                data-key="mainTitle"
              />
              <p
                class="text-lg text-slate-700 leading-relaxed"
                data-key="mainSubtitle"
              ></p>
            </div>
            <div class="flex flex-col sm:flex-row items-center gap-4 justify-center lg:justify-start">
              <a
                href="#recruitment"
                class="btn btn-primary"
                data-key="mainCTA"
                ></a
              >
              <a
                href="#activities"
                class="btn btn-link"
                data-key="mainSecondaryCTA"
                ></a
              >
            </div>
            <div class="grid grid-cols-2 gap-6 rounded-3xl border border-white/60 bg-white/70 p-6 shadow-xl shadow-blue-100/40 lg:max-w-xl">
              <div>
                <p class="text-3xl font-bold text-slate-900" data-key="mainStatsMembers"></p>
                <p class="text-sm text-slate-600" data-key="mainStatsMembersLabel"></p>
              </div>
              <div>
                <p class="text-3xl font-bold text-slate-900" data-key="mainStatsProjects"></p>
                <p class="text-sm text-slate-600" data-key="mainStatsProjectsLabel"></p>
              </div>
            </div>
            </div>
          </div>
        </div>
        <div id="main-events-slider" class="main-events-slider">
          <!-- Events 이미지가 여기에 동적으로 렌더링됩니다 -->
        </div>
      </section>

      <section
        id="about"
        class="section"
      >
        <div class="section-header text-center">
          <p class="section-eyebrow" data-key="aboutEyebrow"></p>
          <h2 class="section-title" data-key="aboutTitle"></h2>
        </div>
        <div class="interactive-grid">
          <article class="feature-card" tabindex="0">
            <div class="feature-card-summary">
              <h3 class="feature-card-title" data-key="aboutCurriculumTitle">
              </h3>
            </div>
            <div class="feature-card-detail">
              <p data-key="aboutCurriculumBody">
              </p>
              <p data-key="aboutCurriculumDetail">
              </p>
            </div>
          </article>
          <article class="feature-card" tabindex="0">
            <div class="feature-card-summary">
              <h3 class="feature-card-title" data-key="aboutCommunityTitle">
              </h3>
            </div>
            <div class="feature-card-detail">
              <p data-key="aboutCommunityBody">
              </p>
              <p data-key="aboutCommunityDetail">
              </p>
            </div>
          </article>
          <article class="feature-card" tabindex="0">
            <div class="feature-card-summary">
              <h3 class="feature-card-title" data-key="aboutMembershipCardTitle">
              </h3>
            </div>
            <div class="feature-card-detail">
              <p data-key="aboutMembershipCardBody">
              </p>
              <p data-key="aboutMembershipCardDetail">
              </p>
            </div>
          </article>
        </div>
      </section>

      <section
        id="activities"
        class="section bg-white"
      >
        <div class="section-header">
          <p class="section-eyebrow" data-key="activitiesEyebrow">Activities</p>
          <h2 class="section-title" data-key="activitiesTitle"></h2>
        </div>
        <div class="grid gap-6 md:grid-cols-3">
          <article class="activity-card">
            <div class="activity-icon">
              <span>⚙️</span>
            </div>
            <h3 class="activity-title" data-key="activitiesRobotsTitle"></h3>
            <p class="activity-body" data-key="activitiesRobotsBody"></p>
          </article>
          <article class="activity-card">
            <div class="activity-icon">
              <span>🧠</span>
            </div>
            <h3 class="activity-title" data-key="activitiesResearchTitle"></h3>
            <p class="activity-body" data-key="activitiesResearchBody"></p>
          </article>
          <article class="activity-card">
            <div class="activity-icon">
              <span>🌐</span>
            </div>
            <h3 class="activity-title" data-key="activitiesOutreachTitle"></h3>
            <p class="activity-body" data-key="activitiesOutreachBody"></p>
          </article>
        </div>
        <div class="activities-highlights">
          <div class="section-header">
            <h3 class="section-title text-2xl" data-key="activitiesHighlightsTitle"></h3>
            <p class="section-description" data-key="activitiesHighlightsDescription"></p>
          </div>
          <div class="grid gap-6 lg:grid-cols-[1.1fr,0.9fr]">
            <div class="space-y-4" id="highlights-awards">
              <!-- 수상실적은 JavaScript로 동적으로 렌더링됩니다 -->
            </div>
            <div class="event-gallery" id="highlights-events">
              <!-- 이벤트는 JavaScript로 동적으로 렌더링됩니다 -->
            </div>
          </div>
          <div
            id="activities-more"
            class="grid gap-6 lg:grid-cols-[1.1fr,0.9fr] activities-more-block hidden"
          >
            <div class="space-y-4" id="highlights-awards-more">
              <!-- 추가 수상실적은 JavaScript로 동적으로 렌더링됩니다 -->
            </div>
            <div class="event-gallery" id="highlights-events-more">
              <!-- 추가 이벤트는 JavaScript로 동적으로 렌더링됩니다 -->
            </div>
          </div>
          <div class="flex justify-center mt-6">
            <button
              class="btn btn-secondary text-sm font-semibold"
              type="button"
              data-show-more="activities-more"
              data-show-more-label-expanded="activitiesShowLess"
              aria-expanded="false"
              data-key="activitiesShowMore"
            ></button>
          </div>
          <div class="activities-cta">
            <a
              href="archive.html"
              class="activities-view-all"
              data-key="activitiesViewAll"
            ></a>
          </div>
        </div>
      </section>
      <section
        id="recruitment"
        class="section"
      >
        <div class="section-header text-center">
          <p class="section-eyebrow" data-key="recruitmentEyebrow"></p>
          <h2 class="section-title" data-key="recruitmentTitle"></h2>
          <p class="section-description" data-key="recruitmentSubtitle"></p>
        </div>
        <div class="grid gap-6 md:grid-cols-3">
          <div class="info-card">
            <h3 class="info-card-title" data-key="recruitmentApplicationTitle"></h3>
            <p class="info-card-body whitespace-pre-line" data-key="recruitmentApplicationBody"></p>
          </div>
          <div class="info-card">
            <h3 class="info-card-title" data-key="recruitmentScheduleTitle"></h3>
            <p class="info-card-body whitespace-pre-line" data-key="recruitmentScheduleBody"></p>
          </div>
          <div class="info-card">
            <h3 class="info-card-title" data-key="recruitmentContactTitle"></h3>
            <p class="info-card-body" data-key="recruitmentContactBody"></p>
          </div>
        </div>
        <div class="mt-8 text-center">
          <a
            href="https://forms.gle/ekHQWZbxBSpAB2JA9"
            class="btn btn-primary"
            data-key="recruitmentApplyCTA"
            target="_blank"
            rel="noopener"
          ></a>
        </div>
      </section>

      <section
        id="keywords"
        class="section bg-white"
      >
        <div class="section-header text-center">
          <p class="section-eyebrow" data-key="keywordsEyebrow"></p>
          <p class="section-description" data-key="keywordsDescription"></p>
        </div>
        <div class="tag-grid">
          <span class="tag-chip">Optimal Control</span>
          <span class="tag-chip">Design</span>
          <span class="tag-chip">Reinforcement Learning</span>
          <span class="tag-chip">Embedded Software</span>
          <span class="tag-chip">Autonomous Driving</span>
          <span class="tag-chip">AI</span>
          <span class="tag-chip">Locomotion</span>
          <span class="tag-chip">Manipulation</span>
          <span class="tag-chip">Humanoid</span>
          <span class="tag-chip">SLAM</span>
        </div>
      </section>

      <section
        id="contact"
        class="section bg-white"
      >
        <div class="grid gap-8 lg:grid-cols-[0.9fr,1.1fr]">
          <div class="space-y-4">
            <p class="section-eyebrow" data-key="contactEyebrow"></p>
            <h2 class="section-title" data-key="contactTitle"></h2>
            <p class="section-description" data-key="contactDescription"></p>
          </div>
          <div class="space-y-4">
            <div class="grid gap-4 sm:grid-cols-2">
              <div class="contact-card">
                <p class="contact-label" data-key="contactLeadLabel"></p>
                <p class="contact-value" data-key="contactLeadValue"></p>
              </div>
              <div class="contact-card">
                <p class="contact-label" data-key="contactEmailLabel"></p>
                <a
                  href="mailto:roboin2019@gmail.com"
                  class="contact-value"
                  data-key="contactEmailValue"
                ></a>
              </div>
            </div>
            <div class="contact-card">
              <p class="contact-label" data-key="contactLocationLabel"></p>
              <p class="contact-value" data-key="contactLocationBody"></p>
            </div>
            <div class="social-panel">
              <h3 class="highlight-title" data-key="socialTitle"></h3>
              <p class="highlight-body" data-key="socialDescription"></p>
              <div class="grid gap-4 sm:grid-cols-2">
                <a
                  class="social-card"
                  href="https://www.instagram.com/roboin_yonsei/"
                  target="_blank"
                  rel="noreferrer"
                >
                  <p class="social-card-label" data-key="socialInstagramLabel"></p>
                  <p class="social-card-body" data-key="socialInstagramBody"></p>
                </a>
                <a
                  class="social-card"
                  href="https://www.youtube.com/channel/UCoNn5Nb7f7l1x11SchF3cBw"
                  target="_blank"
                  rel="noreferrer"
                >
                  <p class="social-card-label" data-key="socialYoutubeLabel"></p>
                  <p class="social-card-body" data-key="socialYoutubeBody"></p>
                </a>
                <a
                  class="social-card"
                  href="https://cafe.naver.com/yonseiunivroboin"
                  target="_blank"
                  rel="noreferrer"
                >
                  <p class="social-card-label" data-key="socialCafeLabel"></p>
                  <p class="social-card-body" data-key="socialCafeBody"></p>
                </a>
                <a
                  class="social-card"
                  href="https://github.com/yonsei-roboin"
                  target="_blank"
                  rel="noreferrer"
                >
                  <p class="social-card-label" data-key="socialGithubLabel"></p>
                  <p class="social-card-body" data-key="socialGithubBody"></p>
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Media Modal (Events) -->
    <div
      id="media-modal"
      class="media-modal hidden"
      aria-hidden="true"
    >
      <div class="media-modal-backdrop" data-media-close></div>
      <div
        class="media-modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="media-modal-caption"
      >
        <button
          class="media-modal-close"
          type="button"
          data-media-close
          data-key="mediaModalClose"
        ></button>
        <img
          id="media-modal-img"
          alt=""
        />
        <div class="media-modal-info">
          <h3 id="media-modal-title" class="media-modal-title"></h3>
          <p id="media-modal-date" class="media-modal-date"></p>
          <p id="media-modal-description" class="media-modal-description"></p>
        </div>
      </div>
    </div>

    <!-- Award Modal -->
    <div
      id="award-modal"
      class="award-modal hidden"
      aria-hidden="true"
    >
      <div class="award-modal-backdrop" data-award-close></div>
      <div
        class="award-modal-content"
        role="dialog"
        aria-modal="true"
      >
        <button
          class="award-modal-close"
          type="button"
          data-award-close
          data-key="modalClose"
          aria-label="닫기"
        >
          ✕
        </button>
        <h3 id="award-modal-title" class="award-modal-title"></h3>
        <p id="award-modal-body" class="award-modal-body"></p>
        <figure class="award-modal-figure">
          <img
            id="award-modal-img"
            alt=""
            class="award-modal-img"
          />
          <figcaption id="award-modal-caption" class="award-modal-caption"></figcaption>
        </figure>
      </div>
    </div>

    <!-- Image Zoom Modal -->
    <div
      id="image-zoom-modal"
      class="image-zoom-modal hidden"
      aria-hidden="true"
    >
      <div class="image-zoom-backdrop" data-image-zoom-close></div>
      <div class="image-zoom-content">
        <button
          class="image-zoom-close"
          type="button"
          data-image-zoom-close
          data-key="modalClose"
          aria-label="닫기"
        >
          ✕
        </button>
        <img
          id="image-zoom-img"
          alt=""
          class="image-zoom-img"
        />
      </div>
    </div>

    <footer class="border-t border-slate-200 bg-slate-50">
      <div class="max-w-6xl mx-auto px-4 py-8 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
        <p class="text-sm text-slate-600" data-key="footerTagline"></p>
        <p class="text-sm text-slate-500" data-key="footerRights"></p>
      </div>
    </footer>

    <script type="module" src="assets/js/script.js"></script>
  </body>
</html>
