<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title data-key="pageTitle"></title>
    <meta
      name="description"
      content="연세대학교 로봇 동아리 Roboin 동아리방 리소스 - 사용 가능한 장비와 리소스 목록"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="assets/css/styles.css"
    />
  </head>
  <body class="font-sans text-slate-900 bg-slate-50">
    <a
      href="#main"
      class="skip-link"
      data-key="skipLink"
    ></a>
    <header class="sticky top-0 z-50 bg-slate-50/90 backdrop-blur border-b border-slate-200">
      <div class="max-w-6xl mx-auto flex items-center justify-between px-4 py-4">
        <a
          href="index.html#main"
          class="flex items-center gap-2 text-xl font-semibold tracking-tight text-slate-900"
        >
          <img
            src="assets/images/logo.jpg"
            alt="Roboin"
            class="h-10 w-10 rounded-full object-cover"
          />
          <span data-key="brandTitle"></span>
        </a>
        <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
          <a
            href="index.html#main"
            class="nav-link"
            data-key="navHome"
          ></a>
          <a
            href="index.html#about"
            class="nav-link"
            data-key="navAbout"
          ></a>
          <a
            href="index.html#activities"
            class="nav-link"
            data-key="navActivities"
          ></a>
          <a
            href="index.html#recruitment"
            class="nav-link"
            data-key="navRecruitment"
          ></a>
          <a
            href="index.html#contact"
            class="nav-link"
            data-key="navContact"
          ></a>
          <a
            href="archive.html"
            class="nav-link"
            data-key="navArchive"
          ></a>
          <a
            href="resources.html"
            class="nav-link active"
            data-key="navResources"
          ></a>
        </nav>
        <div class="flex items-center gap-3">
          <button
            id="lang-toggle"
            class="btn btn-secondary text-sm font-semibold"
            type="button"
            data-key="langToggleLabel"
          ></button>
          <button
            id="mobile-menu-toggle"
            class="md:hidden inline-flex items-center justify-center rounded-full border border-slate-300 p-2 text-slate-700"
            type="button"
            aria-label="Menu"
            aria-expanded="false"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.8"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
        </div>
      </div>
      <nav
        id="primary-nav"
        class="md:hidden hidden border-t border-slate-200 bg-white"
      >
        <a
          href="index.html#main"
          class="mobile-nav-link"
          data-key="navHome"
        ></a>
        <a
          href="index.html#about"
          class="mobile-nav-link"
          data-key="navAbout"
        ></a>
        <a
          href="index.html#activities"
          class="mobile-nav-link"
          data-key="navActivities"
        ></a>
        <a
          href="index.html#recruitment"
          class="mobile-nav-link"
          data-key="navRecruitment"
        ></a>
        <a
          href="index.html#contact"
          class="mobile-nav-link"
          data-key="navContact"
        ></a>
        <a
          href="archive.html"
          class="mobile-nav-link"
          data-key="navArchive"
        ></a>
        <a
          href="resources.html"
          class="mobile-nav-link"
          data-key="navResources"
        ></a>
      </nav>
    </header>

    <main id="main" class="relative">
      <section class="archive-main">
        <div class="max-w-4xl mx-auto px-4 py-20 text-center space-y-6">
          <p class="section-eyebrow mx-auto" data-key="resourcesMainEyebrow"></p>
          <h1 class="text-4xl sm:text-5xl font-bold text-slate-900" data-key="resourcesMainTitle"></h1>
          <p class="text-lg text-slate-600" data-key="resourcesMainSubtitle"></p>
          <a
            href="index.html#activities"
            class="btn btn-primary"
            data-key="archiveMainCTA"
          ></a>
        </div>
      </section>

      <section class="section">
        <div class="section-header">
          <p class="section-description" data-key="resourcesDescription">
            프로젝트와 연구에 필요한 다양한 하드웨어와 소프트웨어 리소스를 제공합니다.
          </p>
        </div>
        <div id="resources-container" class="grid gap-6 lg:grid-cols-2 xl:grid-cols-3">
          <!-- 리소스는 JavaScript로 동적으로 렌더링됩니다 -->
        </div>
      </section>
    </main>

    <footer class="border-t border-slate-200 bg-slate-50">
      <div class="max-w-6xl mx-auto px-4 py-8 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
          <p class="text-sm text-slate-600" data-key="footerTagline"></p>
        <p class="text-sm text-slate-500" data-key="footerRights"></p>
      </div>
    </footer>

    <script type="module" src="assets/js/script.js"></script>
  </body>
</html>
